name: feishu-webhook-action
description: >-
  Generic Feishu (Lark) custom-bot notification: multi-target webhooks, per-target
  signing, simple cards and raw card JSON passthrough, with an optional GitHub run
  context appended. Python 3 standard library, zero dependencies, no build step.
branding:
  icon: bell
  color: blue

inputs:
  webhooks:
    description: >-
      Multi-line webhook targets, one per line. Each line is a hook URL or
      `url|signing-secret`. Takes precedence over webhook_url.
    required: false
  webhook_url:
    description: Single webhook URL, used as fallback when webhooks is empty.
    required: false
  webhook_secret:
    description: Single-target signing secret, paired with webhook_url.
    required: false
  msg_type:
    description: "Simple-mode message type: text (plain text) / markdown (default, interactive card markdown)."
    required: false
    default: markdown
  title:
    description: Card title (used by the simple-mode interactive card).
    required: false
  content:
    description: "Simple-mode body: plain text or markdown content."
    required: false
  card_json:
    description: >-
      Passthrough mode: a complete Feishu card object as JSON. When set, the
      simple-mode title / content / msg_type / extra_elements / include_context
      inputs are ignored; the action only handles signing and transport.
    required: false
  status:
    description: "Run status: success / failure / cancelled / skipped, used to map the card color template."
    required: false
  template:
    description: Card color template (e.g. green / red / blue / grey); overrides the status mapping.
    required: false
  include_context:
    description: Whether to append the GitHub context (repository, ref, commit, event, run link) to the simple-mode card.
    required: false
    default: "true"
  extra_elements:
    description: JSON array of extra elements (e.g. buttons) appended to the simple-mode card elements.
    required: false
  dry_run:
    description: Print the request body only; do not actually send the webhook.
    required: false
    default: "false"
  fail_on_error:
    description: Exit non-zero when any target fails (default false; notification failures do not block the CI).
    required: false
    default: "false"

outputs:
  status:
    description: success (all sent or skipped) / failure (at least one target failed) / skipped (no webhook configured).
  sent:
    description: Number of targets that sent successfully.
  failed:
    description: Number of targets that failed to send.

runs:
  using: composite
  steps:
    - name: Send Feishu notification
      shell: bash
      env:
        INPUT_WEBHOOKS: ${{ inputs.webhooks }}
        INPUT_WEBHOOK_URL: ${{ inputs.webhook_url }}
        INPUT_WEBHOOK_SECRET: ${{ inputs.webhook_secret }}
        INPUT_MSG_TYPE: ${{ inputs.msg_type }}
        INPUT_TITLE: ${{ inputs.title }}
        INPUT_CONTENT: ${{ inputs.content }}
        INPUT_CARD_JSON: ${{ inputs.card_json }}
        INPUT_STATUS: ${{ inputs.status }}
        INPUT_TEMPLATE: ${{ inputs.template }}
        INPUT_INCLUDE_CONTEXT: ${{ inputs.include_context }}
        INPUT_EXTRA_ELEMENTS: ${{ inputs.extra_elements }}
        INPUT_DRY_RUN: ${{ inputs.dry_run }}
        INPUT_FAIL_ON_ERROR: ${{ inputs.fail_on_error }}
      run: python3 "$GITHUB_ACTION_PATH/notify.py"
